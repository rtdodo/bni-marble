<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2715%27 fill=%27%23CF2030%27/%3E%3Ccircle cx=%2711%27 cy=%2711%27 r=%274%27 fill=%27%23fff%27 opacity=%27.6%27/%3E%3C/svg%3E">
</head>
<body style="margin:0">
<title>BNI 마블 룰렛</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Gothic+A1:wght@400;600;800&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Jua&family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: 좌측 컨트롤 패널 + 우측 마블 스테이지(캔버스). 모바일은 스테이지 → 패널 순으로 쌓임.
   5개 스킨은 각자 하나의 완결된 룩(라이트/다크 고정)이라 data-skin 으로만 전환. */
:root{
  --bg:#EDEFF2; --bg-paint:#EDEFF2; --surface:#FFFFFF; --surface-2:#F4F5F7; --ink:#15171C; --muted:#5F6672;
  --line:#DCE0E5; --accent:#CF2030; --accent-ink:#FFFFFF; --accent-soft:#FBE8EA; --stage:#FFFFFF;
  --radius:14px; --radius-sm:9px; --bw:1px; --bc:#DCE0E5; --shadow:0 1px 2px rgba(16,24,40,.05),0 10px 28px rgba(16,24,40,.07);
  --blur:none; --btn-shadow:none;
  --f-display:'Black Han Sans','IBM Plex Sans KR',system-ui,sans-serif;
  --f-body:'IBM Plex Sans KR','Noto Sans KR',system-ui,sans-serif;
  color-scheme:light;
}
:root[data-skin="b"]{
  --bg:#07090D; --bg-paint:radial-gradient(1200px 600px at 80% -10%,rgba(255,59,74,.16),transparent 60%),#07090D;
  --surface:#10141B; --surface-2:#171C25; --ink:#EDF0F5; --muted:#8B95A4; --line:#232A35; --accent:#FF3B4A; --accent-ink:#FFFFFF;
  --accent-soft:rgba(255,59,74,.14); --stage:#0B0E13; --bc:#232A35; --shadow:0 0 0 1px rgba(255,59,74,.07),0 16px 40px rgba(0,0,0,.55);
  --f-display:'Do Hyeon','Noto Sans KR',system-ui,sans-serif; --f-body:'Noto Sans KR',system-ui,sans-serif; color-scheme:dark;
}
:root[data-skin="c"]{
  --bg:#FBE6DE; --bg-paint:linear-gradient(140deg,#FFD3C6 0%,#FBE9E1 45%,#CDEDE6 100%);
  --surface:rgba(255,255,255,.62); --surface-2:rgba(255,255,255,.5); --ink:#2B201E; --muted:#6F5B56; --line:rgba(255,255,255,.85);
  --accent:#E2483D; --accent-ink:#FFFFFF; --accent-soft:rgba(226,72,61,.12); --stage:rgba(255,255,255,.38); --bc:rgba(255,255,255,.9);
  --radius:22px; --radius-sm:14px; --shadow:0 10px 30px rgba(140,70,55,.14); --blur:blur(16px) saturate(1.2);
  --f-display:'Gothic A1',system-ui,sans-serif; --f-body:'Gothic A1','Noto Sans KR',system-ui,sans-serif; color-scheme:light;
}
:root[data-skin="d"]{
  --bg:#0A1F19; --bg-paint:#0A1F19; --surface:#10291F; --surface-2:#153427; --ink:#F2EAD3; --muted:#A3B4A2; --line:#24453A;
  --accent:#D4AF5A; --accent-ink:#10291F; --accent-soft:rgba(212,175,90,.14); --stage:#0F2A22; --bc:#2A4D40;
  --radius:6px; --radius-sm:4px; --shadow:0 18px 40px rgba(0,0,0,.35);
  --f-display:'Nanum Myeongjo',serif; --f-body:'Noto Sans KR',system-ui,sans-serif; color-scheme:dark;
}
:root[data-skin="e"]{
  --bg:#FFD23F; --bg-paint:#FFD23F; --surface:#FFFFFF; --surface-2:#FFF3C4; --ink:#111111; --muted:#45403A; --line:#111111;
  --accent:#E63946; --accent-ink:#FFFFFF; --accent-soft:#FFE1E3; --stage:#FFE58A; --bw:2.5px; --bc:#111111;
  --radius:14px; --radius-sm:10px; --shadow:5px 5px 0 #111111; --btn-shadow:3px 3px 0 #111111;
  --f-display:'Jua','Noto Sans KR',system-ui,sans-serif; --f-body:'Noto Sans KR',system-ui,sans-serif; color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg-paint);background-color:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(300px,350px) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:12px 16px;padding:14px 16px}
.top{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand h1{margin:0;font-family:var(--f-display);font-size:26px;line-height:1.1;letter-spacing:-.01em;font-weight:800;text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.bni{display:inline-flex;align-items:center;justify-content:center;font:800 11px/1 var(--f-body);letter-spacing:.06em;color:#CF2030;background:#FFFFFF;border:1.5px solid #CF2030;border-radius:999px;padding:4px 7px}
.brand .bni{font-size:13px;padding:7px 10px}

.skins{display:flex;gap:8px;overflow-x:auto;max-width:100%;padding:2px 2px 6px}
.skin{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:7px 12px 7px 8px;border-radius:999px;border:var(--bw) solid var(--bc);background:var(--surface);cursor:pointer;font-size:13px;white-space:nowrap;backdrop-filter:var(--blur)}
.skin[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.skin b{font-weight:700}
.sw{display:inline-flex}
.sw i{width:12px;height:12px;border-radius:50%;margin-left:-3px;border:1.5px solid rgba(255,255,255,.9);box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.sw i:first-child{margin-left:0}

.panel{grid-column:1;grid-row:2;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:4px}
.card{background:var(--surface);border:var(--bw) solid var(--bc);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;backdrop-filter:var(--blur);display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 span{letter-spacing:0;text-transform:none;font-weight:500}
textarea{width:100%;min-height:150px;resize:vertical;border:var(--bw) solid var(--bc);border-radius:var(--radius-sm);background:var(--surface-2);padding:10px 12px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:13px;line-height:1.55}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{appearance:none;border:var(--bw) solid var(--bc);background:var(--surface-2);border-radius:var(--radius-sm);padding:8px 13px;cursor:pointer;font-weight:600;font-size:13.5px;box-shadow:var(--btn-shadow);display:inline-flex;align-items:center;gap:6px;transition:transform .08s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
:root[data-skin="e"] .btn.primary{border-color:#111}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.drop{border:1.5px dashed var(--bc);border-radius:var(--radius-sm);padding:12px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer;background:var(--surface-2)}
:root[data-skin="e"] .drop{border-width:2.5px}
.drop.over{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.drop strong{color:var(--ink)}
.note{font-size:12.5px;color:var(--muted);margin:0}
.note.ok{color:var(--ink);background:var(--accent-soft);border-radius:var(--radius-sm);padding:8px 10px}
.note.warn{color:#B4231F}
:root[data-skin="b"] .note.warn,:root[data-skin="d"] .note.warn{color:#FF8A80}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px}
.field label{font-weight:600}
select,input[type="number"]{border:var(--bw) solid var(--bc);background:var(--surface-2);border-radius:var(--radius-sm);padding:7px 9px}
input[type="number"]{width:70px}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}
.roster{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;max-height:300px;overflow:auto}
.roster li{display:grid;grid-template-columns:14px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:4px 2px;font-size:13px;border-bottom:1px solid var(--line)}
:root[data-skin="e"] .roster li{border-bottom-width:1px}
.roster .dot{width:12px;height:12px;border-radius:50%}
.roster .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.roster .meta{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;text-align:right}
.roster .tl{border:0;cursor:pointer;min-width:46px;justify-content:center}
.gates{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;font-size:11px;text-align:center}
.gates div{background:var(--surface-2);border-radius:var(--radius-sm);padding:6px 2px;border:var(--bw) solid var(--bc)}
.gates b{display:block;font-size:11.5px}

.stage.final{outline:3px solid var(--accent);outline-offset:-3px;animation:beat .9s ease-in-out infinite}
@keyframes beat{50%{outline-color:transparent}}
.stage.final .live .head::after{content:'· FINAL 역전 구간';color:var(--ink);letter-spacing:0;font-weight:700}
.stage{grid-column:2;grid-row:2;position:relative;min-height:0;border-radius:var(--radius);overflow:hidden;background:var(--stage);border:var(--bw) solid var(--bc);box-shadow:var(--shadow)}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.hud{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;pointer-events:none}
.hud > *{pointer-events:auto}
.status{background:var(--surface);border:var(--bw) solid var(--bc);border-radius:999px;padding:6px 12px;font-size:12.5px;font-variant-numeric:tabular-nums;box-shadow:var(--shadow);backdrop-filter:var(--blur)}
.ctrl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ctrl .btn{background:var(--surface)}
.ctrl .btn.primary{background:var(--accent);padding:9px 18px;font-size:14.5px}
.speed{display:inline-flex;border:var(--bw) solid var(--bc);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface);box-shadow:var(--btn-shadow)}
.speed button{border:0;background:transparent;padding:8px 10px;cursor:pointer;font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.speed button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.ranking{position:absolute;top:12px;right:12px;width:180px;max-height:calc(100% - 80px);overflow:auto;margin:0;padding:8px;list-style:none;background:var(--surface);border:var(--bw) solid var(--bc);border-radius:var(--radius-sm);box-shadow:var(--shadow);backdrop-filter:var(--blur);font-size:12.5px;display:flex;flex-direction:column;gap:2px}
.ranking:empty{display:none}
.ranking li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:6px;align-items:center;padding:2px 4px;border-radius:6px;font-variant-numeric:tabular-nums}
.ranking li.win{background:var(--accent);color:var(--accent-ink)}
.ranking .n{color:var(--muted);font-size:11px;text-align:right}
.ranking li.win .n{color:inherit}
.ranking .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ranking .d{width:9px;height:9px;border-radius:50%}
.ranking .head{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);padding:2px 4px 4px}
.toasts{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(90%,420px)}
.toast{background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:14px;font-size:13px;font-weight:600;box-shadow:var(--shadow);animation:tin .25s ease-out;text-align:center;max-width:100%}
.toast em{font-style:normal;color:var(--accent)}
:root[data-skin="a"] .toast em,:root[data-skin="c"] .toast em,:root[data-skin="e"] .toast em{color:#FF6B76}
.live{position:absolute;top:12px;left:90px;min-width:168px;max-width:46%;background:var(--surface);border:var(--bw) solid var(--bc);border-radius:var(--radius-sm);box-shadow:var(--shadow);backdrop-filter:var(--blur);padding:8px 10px;display:flex;flex-direction:column;gap:3px;pointer-events:none}
.live .head{font-size:10.5px;font-weight:800;letter-spacing:.14em;color:var(--accent);display:flex;align-items:center;gap:6px}
.live .head::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--accent);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.live .r{display:grid;grid-template-columns:20px minmax(0,1fr);gap:7px;align-items:center;font-weight:700;font-size:14px;transition:transform .2s}
.live .r .md{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#1A1A1A}
.live .r .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live .r.up{animation:up .35s ease-out}
@keyframes up{from{transform:translateX(-6px);opacity:.4}to{transform:none;opacity:1}}
.flash{position:absolute;left:50%;top:22%;transform:translate(-50%,-50%);pointer-events:none;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;width:min(92%,520px)}
.flash .big{font-family:var(--f-display);font-size:clamp(28px,6vw,54px);line-height:1;font-weight:800;color:#FFFFFF;background:var(--accent);padding:10px 22px;border-radius:var(--radius-sm);box-shadow:0 10px 30px rgba(0,0,0,.25);letter-spacing:.02em}
:root[data-skin="d"] .flash .big{color:#10291F}
:root[data-skin="e"] .flash .big{border:2.5px solid #111;box-shadow:5px 5px 0 #111}
.flash .sub{background:var(--ink);color:var(--bg);padding:5px 14px;border-radius:999px;font-weight:700;font-size:14px;max-width:100%}
.flash.on{animation:flash 1s ease-out forwards}
@keyframes flash{0%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}14%{opacity:1;transform:translate(-50%,-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(.98)}}
@keyframes tin{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}

.winner{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.28)}
.win-card{max-height:100%;overflow:auto;width:min(440px,100%);background:var(--surface);border:var(--bw) solid var(--bc);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:12px;text-align:center;backdrop-filter:var(--blur);animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
:root[data-skin="c"] .win-card{background:rgba(255,255,255,.88)}
.win-card.two{width:min(760px,100%)}
.win-list{display:grid;gap:14px}
.win-card.two .win-list{grid-template-columns:repeat(2,minmax(0,1fr))}
.wb{display:flex;flex-direction:column;gap:9px;align-items:center;padding:14px;border-radius:var(--radius-sm);background:var(--surface-2);border:var(--bw) solid var(--bc);min-width:0}
.wb-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.wb .md{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#1A1A1A;font-size:14px}
.wb .wn{font-family:var(--f-display);font-size:38px;line-height:1.1;font-weight:800}
.wb .wlabel{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em}
.wb .ttl{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:4px 13px;font-size:13px;font-weight:700}
.facts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:13px;text-align:left;width:100%}
.facts li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;line-height:1.45}
.facts b{color:var(--muted);font-weight:600;font-size:12px}
.wb .stamps li{font-size:9.5px;padding:4px 1px}
.cheer{margin:0;font-weight:700;font-size:15.5px;text-wrap:balance}
.cheer em{font-style:normal;color:var(--accent)}
.toast small{display:block;font-size:12px;font-weight:500;opacity:.88;margin-top:1px}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.eyebrow{margin:0;font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--accent);text-transform:uppercase}
.win-name{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--f-display);font-size:44px;line-height:1.1;font-weight:800;flex-wrap:wrap}
.win-name .bni{font-size:14px;padding:6px 9px}
.win-line{margin:0;color:var(--muted)}
.stamps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.stamps li{border:1.5px dashed var(--accent);color:var(--accent);border-radius:10px;padding:6px 2px;font-size:10.5px;font-weight:700;line-height:1.3;font-variant-numeric:tabular-nums;transform:rotate(-3deg)}
.stamps li:nth-child(even){transform:rotate(2deg)}
.stamps li span{display:block;font-weight:500;color:var(--muted)}
.win-stats{margin:0;font-size:13px}
.win-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

@media (max-width:860px){
  .live{min-width:0;font-size:12px}
  .live .r{font-size:12.5px}
  .app{height:auto;grid-template-columns:minmax(0,1fr)}
  .stage{grid-column:1;grid-row:2;height:66svh;min-height:430px}
  .panel{grid-column:1;grid-row:3;overflow:visible}
  .ranking{width:132px;font-size:11.5px;max-height:45%}
  .brand h1{font-size:22px}
  .win-name{font-size:34px}
  .win-card.two .win-list{grid-template-columns:minmax(0,1fr)}
  .wb .wn{font-size:30px}
  .win-card{padding:16px}
}
@media (prefers-reduced-motion:reduce){.stage.final,.flash.on,.toast,.win-card,.live .r.up,.live .head::before{animation:none}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <span class="bni" aria-hidden="true">BNI</span>
      <div>
        <h1>마블 룰렛</h1>
        <p id="subtitle">1-2-1 · 교육 · 리퍼럴 · 비지터 초대 관문을 지나 Givers Gain 결승선까지</p>
      </div>
    </div>
    <nav class="skins" id="skins" aria-label="디자인 시안"></nav>
  </header>

  <aside class="panel">
    <section class="card">
      <h2>가중치 엑셀 <span id="sheetDate"></span></h2>
      <label class="drop" id="drop" for="file">
        <strong>엑셀 파일 끌어놓기</strong> 또는 클릭해서 선택<br>
        <span>A 이름 · B 최종배수 · C~I 리퍼럴/비지터/기본</span>
      </label>
      <input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
      <p class="note" id="importNote">이름 × 최종배수만큼 구슬이 생깁니다. B열이 비어 있으면 리퍼럴×2 + 비지터×3 + 기본으로 계산합니다.</p>
    </section>

    <section class="card">
      <h2>참가자 <span id="totals"></span></h2>
      <textarea id="names" spellcheck="false" aria-label="참가자 명단"></textarea>
      <p class="note">한 줄에 한 명: <code>이름*배수 #그린</code> · 트래픽 라이트 태그는 #그린 #옐로 #레드 #그레이 (생략 가능)</p>
      <ul class="roster" id="roster"></ul>
      <p class="note">명단의 신호등 칩을 누르면 트래픽 라이트가 바뀝니다. 이름표 색이 따라 바뀌어요.</p>
    </section>

    <section class="card">
      <h2>당첨 규칙</h2>
      <div class="row">

let stats = new Map(); // 엑셀에서 온 이름별 실적 (리퍼럴/비지터)
function parseText(txt){
  const map = new Map(), order = [];
  txt.split(/[\n,]+/).forEach(raw => {
    let s = raw.trim(); if (!s) return;
    let light = null;
    s = s.replace(/#\s*([^\s#*]+)/g, (_,t) => { light = normLight(t) || light; return ''; });
    let w = 1;
    s = s.replace(/\*\s*(-?[0-9]*\.?[0-9]+)/, (_,n) => { w = parseFloat(n); return ''; });
    const name = s.trim();
    if (!name || !(w > 0)) return;
    if (map.has(name)) { const e = map.get(name); e.w += w; if (light) e.light = light; }
    else { const e = {name, w, light}; map.set(name, e); order.push(e); }
  });
  return order;
}
let persons = [], countNote = '';
function computeCounts(list){
  const sum = list.reduce((a,e)=>a+e.w,0);
  const dec = list.some(e => Math.abs(e.w - Math.round(e.w)) > 1e-9);
  let scale = 1; countNote = '';
  if (dec) { for (const s of [10,5,4,2]) if (sum*s <= 400) { scale = s; break; } countNote = `소수 배수라 ×${scale}로 환산`; }
  if (sum*scale > 600) { scale = 600/sum; countNote = '구슬이 너무 많아 비율 유지하며 축소'; }
  list.forEach(e => e.count = Math.max(1, Math.round(e.w*scale)));
  return list;
}
function fmtW(w){ return Number.isInteger(w) ? String(w) : String(+w.toFixed(2)); }

/* ───────── 엑셀 ───────── */
const KEYS = {
  name:['최종대상자','대상자','이름(한글)','이름','성명','멤버','회원','name'],
  weight:['최종가중치','선물추첨최종배수','최종배수','가중치','배수','weight'],
  inner:['준내부소개','내부소개'], outer:['준외부소개','외부소개'], refTotal:['총리퍼럴','리퍼럴'],
  visitor:['비지터'], base:['기본'], o121:['1-2-1','121','원투원','1:1'], edu:['교육','ceu','에듀'],
  light:['트래픽라이트','트래픽','신호등','traffic','라이트'],
};
function detect(rows){
  for (let h = 0; h < Math.min(rows.length, 15); h++) {
    const hdr = (rows[h]||[]).map(c => String(c ?? '').replace(/\s/g,'').toLowerCase());
    const used = new Set();
    const find = keys => {
      for (const k of keys) { const i = hdr.findIndex((x,j) => x === k && !used.has(j)); if (i >= 0) { used.add(i); return i; } }
      for (const k of keys) { const i = hdr.findIndex((x,j) => x && x.includes(k) && !used.has(j) && !/배수/.test(x.replace(k,'')) ); if (i >= 0) { used.add(i); return i; } }
      return -1;
    };
    const ci = {};
    ci.weight = find(KEYS.weight);
    ci.name = find(KEYS.name);
    if (ci.name < 0) continue;
    ci.inner = find(KEYS.inner); ci.outer = find(KEYS.outer); ci.refTotal = find(KEYS.refTotal);
    ci.visitor = find(KEYS.visitor); ci.base = find(KEYS.base); ci.light = find(KEYS.light); ci.o121 = find(KEYS.o121); ci.edu = find(KEYS.edu);
    // '최종대상자'가 O/X 플래그이고 별도 이름 열이 있으면 필터로 사용
    let flag = -1;
    if (/대상자/.test(hdr[ci.name])) {
      const vals = rows.slice(h+1).map(r => String((r||[])[ci.name] ?? '').trim()).filter(Boolean);
      const isFlag = v => /^(o|x|y|n|yes|no|1|0|true|false|대상|제외|해당|비해당|v|✓|✔|○|×|-)$/i.test(v);
      if (vals.length && vals.filter(isFlag).length / vals.length > .8) {
        flag = ci.name; used.delete(ci.name);
        const alt = hdr.findIndex((x,j) => j !== flag && /^(이름|성명|멤버|회원|name)/.test(x));
        if (alt < 0) continue; ci.name = alt;
      }
    }
    const num = v => { if (v === '' || v == null) return NaN; const n = parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return n; };
    const entries = [], skipped = [], fixed = [];
    for (const r of rows.slice(h+1)) {
      if (!r) continue;
      const name = String(r[ci.name] ?? '').trim();
      if (!name || /^(합계|총계|total|소계)/i.test(name)) continue;
      if (flag >= 0 && !/^(o|y|yes|1|true|대상|해당|v|✓|✔|○)$/i.test(String(r[flag] ?? '').trim())) { skipped.push(name); continue; }
      const g = i => i >= 0 ? num(r[i]) : NaN;
      const inner = g(ci.inner), outer = g(ci.outer), vis = g(ci.visitor), base = g(ci.base);
      let ref = (isNaN(inner)&&isNaN(outer)) ? g(ci.refTotal) : (inner||0)+(outer||0);
      // 원본 수식: 최종배수 = 리퍼럴×2 + 비지터×3 + 기본
      const canCalc = !isNaN(ref) || !isNaN(vis) || !isNaN(base);
      const calc = (ref||0)*2 + (vis||0)*3 + (base||0);
      let w = g(ci.weight);
      if (isNaN(w) && canCalc) w = calc;
      else if (!isNaN(w) && canCalc && Math.abs(w - calc) > 1e-9) fixed.push(`${name}(${fmtW(w)}≠${fmtW(calc)})`);
      if (ci.weight < 0 && !canCalc) w = 1;
      if (!(w > 0)) { skipped.push(name); continue; }
      const o121 = g(ci.o121), edu = g(ci.edu);
      entries.push({name, w, light: normLight(ci.light >= 0 ? r[ci.light] : null),
        st: canCalc ? {inner: inner||0, outer: outer||0, ref: ref||0, vis: vis||0, base: base||0, o121: isNaN(o121) ? null : o121, edu: isNaN(edu) ? null : edu} : null});
    }
    if (entries.length) return {entries, skipped, fixed, header: rows[h], ci, flag, date: h > 0 ? rows.slice(0,h).flat().find(v => v !== '' && v != null) : null};
  }
  return null;
}
function importFile(file){
  if (typeof XLSX === 'undefined') { setNote('엑셀 해석 라이브러리를 불러오지 못했습니다. 네트워크 연결 후 새로고침해 주세요.', 'warn'); return; }
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const wb = XLSX.read(new Uint8Array(fr.result), {type:'array'});
      let best = null;
      for (const sn of wb.SheetNames) {
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, defval:'', raw:true});
        const r = detect(rows);
        if (r && (!best || r.entries.length > best.entries.length)) best = {...r, sheet: sn};
      }
      if (!best) { setNote('이름 열을 찾지 못했습니다. 첫 몇 행 안에 "이름" 또는 "최종 대상자" 머리글이 있는지 확인해 주세요.', 'warn'); return; }
      applyImport(best, file.name);
    } catch(err) { setNote('파일을 읽지 못했습니다: ' + err.message, 'warn'); }
  };
  fr.readAsArrayBuffer(file);
}
function applyImport(res, fileName){
  stats = new Map(res.entries.filter(e=>e.st).map(e => [e.name, e.st]));
  const prevLights = new Map(parseText($('#names').value).filter(e=>e.light).map(e=>[e.name,e.light]));
  $('#names').value = res.entries.map(e => {
    const l = e.light || prevLights.get(e.name);
    return `${e.name}*${fmtW(e.w)}${l ? ' #' + TL[l].label : ''}`;
  }).join('\n');
  const col = i => i >= 0 ? String(res.header[i]).replace(/\s+/g,' ').trim() : null;
  const total = res.entries.reduce((a,e)=>a+e.w,0);
  let msg = `<b>${fileName}</b> · ${res.sheet} 시트에서 ${res.entries.length}명, 구슬 ${fmtW(total)}개를 불러왔습니다. 이름 열 「${col(res.ci.name)}」 × 배수 열 「${col(res.ci.weight) || '리퍼럴×2+비지터×3+기본'}」`;
  if (res.flag >= 0) msg += ` · 「${col(res.flag)}」 O 표시만 포함`;
  if (res.skipped.length) msg += ` · 배수 0/빈칸 제외: ${res.skipped.join(', ')}`;
  if (res.fixed.length) msg += `<br><span class="warn">B열과 C~I 계산값이 다른 행: ${res.fixed.join(', ')} (B열 값 사용)</span>`;
  setNote(msg, 'ok');
  if (res.date) $('#sheetDate').textContent = String(res.date);
  rebuild();
}

function resolve(m,nx,ny,e,svx,svy){
  let rvx = m.vx-svx, rvy = m.vy-svy; const vn = rvx*nx + rvy*ny;
  if (vn >= 0) return 0;

function hitSeg(m,ax,ay,bx,by,t,e,rot){

  let s = ((m.x-ax)*dx + (m.y-ay)*dy)/L2; s = s < 0 ? 0 : s > 1 ? 1 : s;

  if (d2 >= RR*RR) return;

const grid = new Map();
function step(dt){

    if (d.side === 'L') { d.ax = WL+4; d.bx = WL+4+L; } else { d.ax = WR-4-L; d.bx = WR-4; }
  }
  const act = [];
  for (const m of marbles) if (!m.done) act.push(m);

    m.vy += G*dt; m.vx *= .9997;

    const key = (m.gy+4000)*128 + m.gx; let a = grid.get(key); if (!a) grid.set(key, a = []); a.push(i);

      const arr = grid.get((a.gy+oy+4000)*128 + a.gx+ox); if (!arr) continue;

    if (!started) continue;

    for (let g = 0; g < 4; g++) {

function finish(m){

function targetRank(){
  const mode = $('#rankMode').value, total = marbles.length;
  if (mode === 'last') return total;
  if (mode === 'n') return Math.max(1, Math.min(total, parseInt($('#rankN').value,10) || 1));

function checkWinner(){
  if (winner || !started) return;
  const mode = $('#rankMode').value;
  if (mode === 'last') { if (finished.length === marbles.length) declare([{m: finished[finished.length-1], label:'꼴찌 도착'}]); return; }
  if (mode === 'n') { const N = targetRank(); if (finished.length >= N) declare([{m: finished[N-1], label:`${N}번째 도착`}]); return; }
  // 1등 / 1·2등: 같은 멤버의 구슬은 한 번만 인정
  const K = mode === 'top2' ? Math.min(2, persons.length) : 1;
  const seen = new Set(), list = [];
  for (const m of finished) {
    if (seen.has(m.p)) continue;
    seen.add(m.p); list.push({m, label:`${list.length+1}등`});
    if (list.length === K) break;
  }
  const lastIn = finished[finished.length-1];
  if (K === 2 && list.length === 1) {
    if (!provisional.length) {
      const q = quip(list[0].m.p, []);
      toast(`1등 확정! <em>${esc(list[0].m.p.name)}</em> · 이제 2등을 가립니다${q ? `<small>${esc(q)}</small>` : ''}`);
    } else if (lastIn && lastIn.p === list[0].m.p) {
      toast(`<em>${esc(lastIn.p.name)}</em>님 구슬이 또 들어왔지만 1인 1상품! 2등은 다른 분께`);
    }
  }
  provisional = list;
  if (list.length >= K) declare(list);
}

function spawn(){
  const list = [];
  persons.forEach(p => { for (let i = 0; i < p.count; i++) list.push(p); });
  for (let i = list.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [list[i],list[j]] = [list[j],list[i]]; }
  const N = list.length; R = N <= 120 ? 9 : N <= 300 ? 8 : 7;
  const gap = 2*R+3, span = WR-WL-8-2*R, cols = Math.floor(span/gap);
  const x0 = WL+4+R+1 + (span - (cols-1)*gap)/2 - gap/4;
  marbles = list.map((p,i) => {
    const c = i % cols, row = Math.floor(i/cols);
    const x = Math.min(WR-5-R, x0 + c*gap + (row%2 ? gap/2 : 0));
    const y = 330-4-R-1 - row*(2*R+1);
    return {x, y, vx:(Math.random()-.5)*20, vy:0, p, done:false, g:[0,0,0,0], chkX:x, chkY:y, chkT:0, ft:0};
  });

function drawMini(){

let confetti = [];

/* ───────── 루프 ───────── */

  const raw = Math.min(.5, Math.max(0, (now - last)/1000)); last = now;
  const el = Math.min(raw, .1);
  if (started && !winner) raceReal += raw;
  updateCamera();
  const rt = raceReal*speed;
  const hurry = !started || winner ? 1 : rt > HARD_STOP ? 8 : (!finalZone && rt > HURRY_AT) ? 1 + (rt - HURRY_AT)*1.5 : 1;
  let rate;
  if (hurry > 1) rate = TIME_BASE*hurry;
  else if (winner) rate = TIME_BASE*3;  // 당첨 후엔 뒤에서 나머지 순위를 빠르게 마저 매김
  else if (finalPhase === 1) rate = GATHER_RATE;  // 대기실에 모이는 동안은 빨리감기
  else if (finalPhase === 2) rate = SCRAMBLE_RATE;
  else if (finalPhase === 3) { const pt = (raceReal - phaseT)*speed; rate = pt < RELEASE_HOLD ? RELEASE_RATE : Math.min(TIME_BASE, RELEASE_RATE + (pt - RELEASE_HOLD)*2.5); }
  else rate = TIME_BASE*slow;
  acc += el * speed * rate;
  let n = 0;
  while (acc >= DT && n < 320) { step(DT); acc -= DT; n++; }
  if (n >= 320) acc = 0;
  if (cw > 0) draw();
  if (started) updateHud();
  requestAnimationFrame(frame);
}
